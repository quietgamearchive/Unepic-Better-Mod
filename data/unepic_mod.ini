; Unepic Better Mod - settings
; install.ps1 copies this file to the game folder if there is no
; unepic_mod.ini yet.  The mod never overwrites an existing file.
; Most values are read when the game starts; tp_scale, tp_bias_x and tp_bias_y
; are re-read on every right-click teleport.  Values below are the defaults.

[video]
; resize=0 leaves the game window alone; 1 lets the mod size it.
resize=1
; aspect: 0 = 4:3, 1 = 16:9, 2 = 16:10
aspect=0
; scale is in tenths of the base size: 10 = 1.0x, 20 = 2.0x, 50 = 5.0x
; (capped automatically to what fits on the desktop)
scale=20
; optional exact window size; both must be non-zero to override aspect/scale
;width=0
;height=0
; 1 = disable Windows fullscreen optimizations for the game
disable_fso=1

[cheats]
god=0
maxxp=0
; consumables are not used up
nocons=1
; bows, crossbows, wands and similar do not use up ammo or durability
nogun=1
airjump=0
; movement speed percent, 10 .. 1000
speed=100
; attack speed in tenths, 10 .. 100
atkspd=10
teleport=0
; right-click teleport: the landing is checked against the room's walkability grid,
; so any standable spot inside the room works (up, down, sideways).
; This is how far one screen pixel is worth, percent, 10 .. 400.
tp_scale=100
; Click -> world calibration, in world units.  The game draws a 640-unit-tall
; view scaled to the window height, with world (450,286) at the centre of the
; client area (measured 2026-10-24).  These two shift that anchor and tp_scale
; zooms.  Clicks landing right of the cursor: lower tp_bias_x.
; Clicks landing below the cursor: raise tp_bias_y.
tp_bias_x=0
tp_bias_y=0
; multiplayer in-room teleport: 1 = write entity + net player object, 0 = refuse
mp_tp=1
; buff/debuff selection lives in mod\buffs.ini and is edited in the
; "Buffs..." window (one checkbox per effect, All/None for each half,
; Language combo for the game's 19 effect-name dictionaries).

[debug]
; multiplayer picture catch-up: x always, y while airborne, nothing on ladders.
; 1 = on (recommended for co-op), 0 = off.
netsync=1

[items]
; item name and description language: en sp fr ge it pt br cz po hu nl gr ca
; eu ru jp kr ch tw internal
lang=en
; 1 = hide catalogue rows that have no name in the game's dictionaries
hidenamed=0
